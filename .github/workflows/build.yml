name: Build and Release InkPen

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Upgrade pip
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        shell: pwsh
        run: |
          pip install pyinstaller
          if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
          }

      - name: Verify project files
        shell: pwsh
        run: |
          Write-Host "Checking files..."

          if (!(Test-Path "inkpen.py")) {
            Write-Error "inkpen.py not found"
            exit 1
          }

          if (Test-Path "inkpen.ico") {
            Write-Host "Icon file found"
          } else {
            Write-Host "Icon file missing - build will continue without icon"
          }

      - name: Build EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          New-Item -ItemType Directory -Force -Path build

          if (Test-Path "inkpen.spec") {
            pyinstaller inkpen.spec --clean
          }
          else {
            if (Test-Path "inkpen.ico") {
              pyinstaller --onefile --windowed --icon=inkpen.ico inkpen.py
            }
            else {
              pyinstaller --onefile --windowed inkpen.py
            }
          }

      - name: Verify build output
        shell: pwsh
        run: |
          if (!(Test-Path "dist")) {
            Write-Error "dist folder not generated"
            exit 1
          }

          Get-ChildItem dist

      - name: Prepare release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release

          $exe = Get-ChildItem -Path dist -Filter *.exe | Select-Object -First 1

          if ($null -eq $exe) {
            Write-Error "No EXE generated"
            exit 1
          }

          Copy-Item $exe.FullName release/

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path release/*.exe -DestinationPath release/InkPen.zip -Force

      - name: Generate version
        shell: pwsh
        run: |
          $version = "v$(Get-Date -Format 'yyyy.MM.dd.HHmm')"
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: InkPen Release ${{ env.VERSION }}
          files: |
            release/*.exe
            release/InkPen.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InkPen-Build
          path: |
            release/*.exe
            release/InkPen.zip
